<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <title>ระบบขายเบอร์ทอง</title>
</head>
<body>

    <h2>เข้าสู่ระบบ (Login)</h2>
    <input type="text" id="username" placeholder="ชื่อผู้ใช้">
    <input type="password" id="password" placeholder="รหัสผ่าน">
    <button onclick="login()">เข้าสู่ระบบ</button>
    <p id="login-status"></p>

    <hr>

    <h2>สถานะเบอร์ทอง</h2>
    <button onclick="loadNumbers()">โหลดแผงเบอร์ทอง</button>
    <div id="number-board"></div>

    <script>
        // เอา URL ที่ได้จากขั้นตอนการ Deploy Google Script มาใส่ที่นี่
        const SCRIPT_URL = 'ใส่_WEB_APP_URL_ของคุณที่นี่'; 

        async function login() {
            const user = document.getElementById('username').value;
            const pass = document.getElementById('password').value;
            document.getElementById('login-status').innerText = 'กำลังตรวจสอบ...';

            let response = await fetch(SCRIPT_URL, {
                method: 'POST',
                body: JSON.stringify({ action: 'login', username: user, password: pass })
            });
            
            let result = await response.json();
            
            if(result.status === 'success') {
                document.getElementById('login-status').innerText = `ยินดีต้อนรับ! คุณอยู่ในสถานะ: ${result.role} (เครดิต: ${result.credit})`;
            } else {
                document.getElementById('login-status').innerText = result.message;
            }
        }

        async function loadNumbers() {
            let response = await fetch(SCRIPT_URL, {
                method: 'POST',
                body: JSON.stringify({ action: 'getNumbers' })
            });
            
            let result = await response.json();
            let board = document.getElementById('number-board');
            board.innerHTML = '';
            
            if(result.status === 'success') {
                result.data.forEach(item => {
                    // สร้าง block ง่ายๆ เพื่อแสดงผล
                    let div = document.createElement('div');
                    div.innerText = `เบอร์ ${item.number} - ${item.status}`;
                    div.style.padding = '5px';
                    div.style.margin = '2px';
                    div.style.backgroundColor = item.status === 'available' ? 'lightgreen' : 'lightcoral';
                    board.appendChild(div);
                });
            }
        }
    </script>
</body>
</html>
